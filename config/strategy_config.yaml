active_scanner: router
strategy_version: strategy_router_v2.0.0_institutional

# Rule-based router (no LLM). Pick one strategy or NO_TRADE.
router:
  # Rulebook §9 Valid tier starts at 75.
  min_confidence: 75
  log_every_decision: true
  enabled_strategies:
    - vwap_reclaim
    - vwap_bounce
    - vwap_pullback
    - vwap_rejection
    - ema_pullback
    - opening_range_breakout
    - momentum_continuation
    - trend_continuation
    - vwap_trend
    - reversal
    - cpr_breakout
    - pdh_pdl_break
    - oi_breakout
    - delta_momentum
    - gamma_expansion
    - iv_expansion
    - gap_and_go
    - trend_day
    - mean_reversion
    - liquidity_sweep
    # expiry_scalping only fires on expiry day; keep listed
    - expiry_scalping

regime:
  high_vol_atr_mult: 1.4
  low_vol_atr_mult: 0.7
  atr_lookback_bars: 14
  sideways_range_points: 25
  structure_lookback_5m: 6
  block_sideways: true
  block_high_volatility: false
  max_risk_score_to_trade: 80
  opening_phase_minutes: 30
  late_phase_after_minutes: 330

vwap_reclaim:
  bias_timeframe: 5m
  setup_timeframe: 3m
  trigger_timeframe: 1m
  setup_lookback_bars: 8
  trigger_lookback_bars: 5
  max_distance_to_vwap_points: 40
  neutral_bias_blocks_trade: true

vwap_pullback:
  setup_timeframe: 3m
  trigger_timeframe: 1m
  setup_lookback_bars: 10
  min_extension_points: 5
  max_distance_to_vwap_points: 30
  trigger_lookback_bars: 4
  neutral_bias_blocks_trade: true

vwap_trend:
  min_bars_on_side: 3
  min_distance_to_vwap_points: 3
  max_distance_to_vwap_points: 50
  require_1m_momentum: true
  neutral_bias_blocks_trade: true

# Pick among ATM / ATM±1 using Black-Scholes delta/gamma + spread.
strike_selection:
  enabled: true
  atm_band_steps: 1
  target_delta: 0.50
  delta_min: 0.40
  delta_max: 0.65
  prefer_higher_gamma: true
  max_spread_pct: 8
