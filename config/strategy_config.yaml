active_scanner: router
strategy_version: strategy_router_v2.2.0_crypto

# Rule-based router — crypto-tuned (BTC/ETH options on Delta).
router:
  min_confidence: 70
  log_every_decision: true
  enabled_strategies:
    - vwap_trend
    - momentum_continuation

# Sweet-zone entries: not hugging VWAP (chop) and not chasing extended moves.
crypto_entry:
  enabled: true
  min_vwap_distance_atr: 0.03
  max_vwap_distance_atr: 0.38
  reclaim_max_vwap_distance_atr: 0.16
  momentum_max_vwap_distance_atr: 0.36
  trend_max_vwap_distance_atr: 0.50
  allowed_regimes:
    - trending_up
    - trending_down
    - breakout
    - high_volatility

# Quality gate bonuses (paper / thin option chain).
crypto_quality:
  structure_bonus: 8
  reclaim_pullback_bonus: 5
  trend_momentum_bonus: 4
  require_structure_for_reclaim: false
  require_structure_for_trend: true
  require_ema_for_momentum: false

# ATR-relative gates
crypto_scaling:
  use_atr_relative: true
  max_distance_to_vwap_atr: 0.22
  pullback_min_extension_atr: 0.04
  pullback_max_distance_atr: 0.22
  trend_min_distance_atr: 0.03
  trend_max_distance_atr: 0.50

regime:
  high_vol_atr_mult: 1.4
  low_vol_atr_mult: 0.7
  atr_lookback_bars: 14
  sideways_range_points: 25
  sideways_range_atr_mult: 0.35
  breakout_distance_points: 20
  breakout_distance_atr: 0.18
  structure_lookback_5m: 6
  block_sideways: true
  block_high_volatility: false
  max_risk_score_to_trade: 78
  opening_phase_minutes: 30
  late_phase_after_minutes: 330

vwap_bias:
  atr_lookback_bars: 14
  dead_zone_atr_multiplier: 0.40

vwap_reclaim:
  bias_timeframe: 5m
  setup_timeframe: 3m
  trigger_timeframe: 1m
  setup_lookback_bars: 8
  trigger_lookback_bars: 5
  max_fresh_trigger_bars: 1
  min_bars_with_vwap_3m: 0
  max_distance_to_vwap_points: 120
  require_5m_structure: false
  neutral_bias_blocks_trade: true

vwap_pullback:
  setup_timeframe: 3m
  trigger_timeframe: 1m
  setup_lookback_bars: 10
  min_extension_points: 40
  max_distance_to_vwap_points: 120
  trigger_lookback_bars: 4
  neutral_bias_blocks_trade: true

vwap_trend:
  min_bars_on_side: 2
  min_distance_to_vwap_points: 25
  max_distance_to_vwap_points: 400
  require_1m_momentum: false
  neutral_bias_blocks_trade: true

strike_selection:
  enabled: true
  atm_band_steps: 1
  target_delta: 0.50
  delta_min: 0.42
  delta_max: 0.58
  prefer_higher_gamma: true
  max_spread_pct: 6
  vol_aware: true

vol_model:
  iv_slope_lookback: 10
  iv_expand_threshold: 0.02
  iv_contract_threshold: -0.02
  rv_lookback_bars: 60
  iv_expensive_rank: 80
  tte_adjustments:
    ">12h": { size_mult: 1.0, min_confidence_add: 0, max_hold_mult: 1.0 }
    "4-12h": { size_mult: 0.85, min_confidence_add: 3, max_hold_mult: 0.85 }
    "1-4h": { size_mult: 0.65, min_confidence_add: 5, max_hold_mult: 0.65 }
    "30m-1h": { size_mult: 0.45, min_confidence_add: 8, max_hold_mult: 0.45 }
    "<30m": { size_mult: 0.20, min_confidence_add: 12, max_hold_mult: 0.25 }

ev_engine:
  enabled: true
  min_ev: 0.0
  adverse_pct: 0.14
  reward_pct: 0.20
  min_trades_for_pwin: 8
  prior_pwin: 0.48
  assumed_fee_pct_of_premium: 0.02
  paper:
    enabled: true
    prior_pwin: 0.52
    min_ev: 0.02
    bypass_when_rule_score_gte: 88

strategy_health:
  min_trades: 10
  demote_weak_multiplier: 0.85
