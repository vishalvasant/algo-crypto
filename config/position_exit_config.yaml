# Exit when momentum / structure turns unfavorable (not fixed $ SL/target).
# Priority: time stop → adverse drop → trail → trend/bias reversal (guarded).
mode: momentum
bias_flip_exit: true
# Spot must clear VWAP by this many points before trend_reversal (legacy fallback).
bias_flip_buffer_points: 12
# Prefer ATR-relative buffer when ATR is available (wider = fewer VWAP whipsaws).
bias_flip_atr_multiplier: 0.55

# --- Trend reversal guards (hold longer, don't bail winners on noise) ---
# Separate min hold before bias-flip exit (can exceed general min_hold_seconds).
trend_reversal_min_hold_seconds: 120
# Use last 1m close (not tick spot) for reversal — avoids intrabar flicker.
trend_reversal_require_m1_close: true
# Skip reversal when premium is in profit by this % — let trail manage winners.
trend_reversal_defer_profit_pct: 3
# Only fire reversal when underwater (thesis failed, not just noise).
trend_reversal_only_if_underwater: true

# --- Reversal flips (disabled — caused CE↔PE chop in paper session) ---
flip_on_trend_reversal: false
flip_requires_confirmation: true
flip_cooldown_seconds: 300
flip_use_quality_gate: true
flip_min_rule_score: 80

reversal_vwap_distance_atr_multiplier: 0.45
reversal_atr_lookback_bars: 14
reversal_require_candle_close: true
reversal_require_momentum: true
reversal_require_structure: false
reversal_require_volume: false
reversal_min_confirmation_score: 65

trail_giveback_pct: 40
adverse_move_pct_from_entry: 14
# Arm trail once unrealized premium gain ≥ this % of entry (was 18 — too high).
min_profit_before_trail_pct: 5
min_hold_seconds: 90
max_hold_minutes: 30
high_vol_trail_giveback_pct: 35
high_vol_adverse_move_pct_from_entry: 12

thesis_exit_enabled: true
thesis_degrade_below: 40
thesis_min_hold_seconds: 90

dynamic_exits_enabled: true
dynamic_adverse_atr_scale_cap: 0.35
