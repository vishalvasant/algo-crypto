# Crypto momentum exits — avoid NSE-style VWAP reversal chop on 24/7 BTC.
mode: momentum
bias_flip_exit: false
bias_flip_buffer_points: 25
bias_flip_atr_multiplier: 0.65

trend_reversal_min_hold_seconds: 180
trend_reversal_require_m1_close: true
trend_reversal_defer_profit_pct: 5
trend_reversal_only_if_underwater: true

flip_on_trend_reversal: false
flip_requires_confirmation: true
flip_cooldown_seconds: 600
flip_use_quality_gate: true
flip_min_rule_score: 85

reversal_vwap_distance_atr_multiplier: 0.55
reversal_atr_lookback_bars: 14
reversal_require_candle_close: true
reversal_require_momentum: true
reversal_require_structure: true
reversal_require_volume: false
reversal_min_confirmation_score: 70

trail_giveback_pct: 40
trail_giveback_pct_large_mfe: 28
large_mfe_trail_pct: 22
adverse_move_pct_from_entry: 13
adverse_require_vwap_lost: true
min_profit_before_trail_pct: 10
trail_fee_aware: true
trail_min_gross_profit_usd: 0.25
trail_min_net_profit_usd: 0.12
min_hold_seconds: 180
max_hold_minutes: 22
high_vol_trail_giveback_pct: 32
high_vol_adverse_move_pct_from_entry: 15

vwap_side_exit: true
vwap_side_exit_atr_mult: 0.35
vwap_side_exit_min_hold_seconds: 300

thesis_exit_enabled: true
thesis_degrade_below: 35
thesis_min_hold_seconds: 120

dynamic_exits_enabled: true
dynamic_adverse_atr_scale_cap: 0.40
