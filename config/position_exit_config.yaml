# Exit when momentum / structure turns unfavorable (not fixed $ SL/target).
# Priority: time stop → trend/bias reversal → adverse premium drop → trail.
mode: momentum
bias_flip_exit: true
# Spot must clear VWAP by this many points before trend_reversal (legacy fallback).
bias_flip_buffer_points: 8
# Prefer ATR-relative buffer when ATR is available (Gap-Fix Phase 2).
bias_flip_atr_multiplier: 0.35

# --- Reversal flips (no longer forced) ---
# Still evaluate opposite side after trend_reversal, but require confirmation.
flip_on_trend_reversal: true
flip_requires_confirmation: true
flip_cooldown_seconds: 300
# Do NOT inject fake confidence=80 — use QualityGate after confirmation.
flip_use_quality_gate: true
flip_min_rule_score: 75

reversal_vwap_distance_atr_multiplier: 0.35
reversal_atr_lookback_bars: 14
reversal_require_candle_close: true
reversal_require_momentum: true
reversal_require_structure: false
reversal_require_volume: false
reversal_min_confirmation_score: 60

trail_giveback_pct: 35
adverse_move_pct_from_entry: 12
# Only start trailing once unrealized premium gain ≥ this % of entry.
min_profit_before_trail_pct: 18
min_hold_seconds: 45
# Cap marathon holds when VWAP bias never flips.
max_hold_minutes: 25
# Tighter when router last primary regime is high_volatility
high_vol_trail_giveback_pct: 30
high_vol_adverse_move_pct_from_entry: 10

# Gap-Fix Phase 6 — thesis monitor (not more aggressive than % exits by default)
thesis_exit_enabled: true
thesis_degrade_below: 40
thesis_min_hold_seconds: 60

# Gap-Fix Phase 6 — ATR-aware dynamic exit thresholds (soft scale)
dynamic_exits_enabled: true
dynamic_adverse_atr_scale_cap: 0.35
