fill_model: orderbook_walk  # ltp | top_of_book | orderbook_walk
partial_fills: true
simulate_latency_ms: 80
# Extra adverse bps on top of book walk (paper realism)
extra_slippage_bps: 5
# Chance (0–1) to reject for simulation; keep low for paper usability
rejection_probability: 0.0
# Reject when fillable lots < this fraction of order
min_fill_ratio: 0.5
# When depth < order and partial_fills false → reject
reject_on_insufficient_depth: true
